---
layout: default
---

<div class="container m-lg-5">
	<div class="card shadow-none">
		<div class="card-body">
			<h1 class="card-title">{{ page.title }}</h1>
			<p class="text-muted">{{ page.date | date: "%B %-d, %Y" }}</p>
			<div class="card-text">
				{{ page.content }}
			</div>
		</div>
	</div>
</div>
